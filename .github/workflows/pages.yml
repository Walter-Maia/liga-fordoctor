# Publica a pré-visualização no GitHub Pages a cada push na main (ou manualmente, em Actions).
# Só a pasta preview/ vai para o site: código-fonte, QA e documentos não ficam acessíveis pelo link.
name: Pré-visualização no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publica.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # mesmo build do npm run preview, sem o servidor: gera preview/ a partir de src/
      - name: Gera a pré-visualização
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - id: publica
        uses: actions/deploy-pages@v4
