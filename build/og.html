<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Imagem de compartilhamento da Liga ForDoctor</title>
<!-- Composição da og:image (1200×630). Gerada por build/og.mjs; não é publicada. -->
<style>
  @font-face { font-family: "Dosis"; font-weight: 500 700; src: url("../src/assets/fonts/dosis-latin-var.woff2") format("woff2"); }
  @font-face { font-family: "Jost"; font-weight: 400 600; src: url("../src/assets/fonts/jost-latin-var.woff2") format("woff2"); }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #F7F5EF; display: grid; grid-template-columns: 1fr 560px; overflow: hidden; font-family: "Jost", sans-serif; color: #091D3E; }
  .texto { padding: 72px 0 64px 80px; display: flex; flex-direction: column; }
  .texto img { width: 210px; height: auto; }
  .marca { margin: 64px 0 12px; font-family: "Dosis", sans-serif; font-weight: 600; font-size: 34px; color: #7A5C24; }
  h1 { margin: 0; font-family: "Dosis", sans-serif; font-weight: 700; font-size: 60px; line-height: 1.04; letter-spacing: -0.01em; max-width: 520px; }
  .filete { margin-top: auto; width: 64px; height: 3px; background: #C19B52; }
  .foto { position: relative; }
  .foto img { position: absolute; right: 40px; bottom: 0; width: 520px; height: auto; }
</style>
</head>
<body>
  <div class="texto">
    <img src="../src/assets/img/logo-fordoctor.svg" alt="">
    <p class="marca">Liga ForDoctor</p>
    <h1>Abertura de PJ médica gratuita e mais benefícios para sua turma</h1>
    <span class="filete"></span>
  </div>
  <div class="foto"><img src="../src/assets/img/liga-kit-alfa-720.webp" alt=""></div>
</body>
</html>
